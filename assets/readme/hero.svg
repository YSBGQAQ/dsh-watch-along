<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">实时陪看 dsh-watch-along</title>
  <desc id="heroDesc">AI 盯着浏览器里正在播的那个窗口：只读窗口底部 34% 那条带上的字，同时接收画面变化与系统声音，三条通道汇成一条带时间码的事件流。</desc>

  <rect width="1200" height="380" fill="#0A0C0F"/>

  <!-- 标题块 -->
  <g id="title-block">
    <text x="64" y="80" font-family="ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="17" letter-spacing="2.4" fill="#7C8695">DSH 插件 · WINDOWS · 全本地</text>

    <text x="64" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="58" font-weight="700" fill="#E9ECF1" letter-spacing="1">实时陪看</text>
    <text x="64" y="186" font-family="ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="19" fill="#8A94A3" letter-spacing="0.5">dsh-watch-along</text>

    <text x="64" y="240" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" fill="#BCC4D0">AI 盯着你正在看的那个窗口：读字幕、听声音、</text>
    <text x="64" y="272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" fill="#BCC4D0">看画面变化，汇成一条带时间码的事件流。</text>

    <text x="64" y="330" font-family="ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="17" fill="#6B7482">2723 条事件 / 90 分钟 · 238 条测试 · 抓屏认字转写都在本机</text>
  </g>

  <!-- 证据层：被盯住的那个窗口 -->
  <g id="window">
    <rect x="636" y="36" width="504" height="214" rx="12" fill="#10141A" stroke="#232B37" stroke-width="1"/>

    <text x="656" y="64" font-family="ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="17" fill="#7C8695">哔哩哔哩 · 正在播的那个窗口</text>
    <line x1="636" y1="78" x2="1140" y2="78" stroke="#1C2330" stroke-width="1"/>

    <text x="1128" y="104" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#5A6270">上面 66% 不读字</text>
    <rect x="656" y="114" width="300" height="9" rx="4.5" fill="#1C242F"/>
    <rect x="656" y="134" width="232" height="9" rx="4.5" fill="#1A212B"/>
    <rect x="656" y="154" width="220" height="9" rx="4.5" fill="#171D26"/>

    <rect x="636" y="177" width="504" height="73" fill="#F0C24E" opacity="0.07"/>
    <line x1="637" y1="177.5" x2="1139" y2="177.5" stroke="#F0C24E" stroke-width="1.5" opacity="0.85"/>
    <text x="1128" y="170" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#F0C24E">只读这条带 · 底部 34%</text>

    <text x="660" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#F2C96B">给口癖加个称呼</text>
    <text x="660" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="21" fill="#F2C96B">模型怎么解释</text>

    <line x1="738" y1="250" x2="738" y2="292" stroke="#E5645C" stroke-width="2"/>
    <line x1="888" y1="250" x2="888" y2="292" stroke="#F0C24E" stroke-width="2"/>
    <line x1="1038" y1="250" x2="1038" y2="292" stroke="#5BC8C4" stroke-width="2"/>
    <circle cx="738" cy="292" r="4" fill="#E5645C"/>
    <circle cx="888" cy="292" r="4" fill="#F0C24E"/>
    <circle cx="1038" cy="292" r="4" fill="#5BC8C4"/>

    <text x="738" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#C6CDD8">画面变化</text>
    <text x="888" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#C6CDD8">屏幕文字</text>
    <text x="1038" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#C6CDD8">系统声音</text>
  </g>
</svg>
